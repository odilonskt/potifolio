<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <style>
    .bg { fill: #00629a; }
    .fg { fill: none; stroke: #f8fafd; }
    .dot { fill: #f8fafd; }
    .edge { fill: none; stroke: none; }
    .orbit {
      transform-origin: 16px 16px;
      animation: orbit 1.4s cubic-bezier(0.65, 0, 0.35, 1) 0.3s 1 both;
    }
    @keyframes orbit {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #020202; }
      .fg { stroke: #8ed9fe; }
      .dot { fill: #8ed9fe; }
      .edge { stroke: #8ed9fe; stroke-opacity: 0.3; }
    }
    @media (prefers-reduced-motion: reduce) {
      .orbit { animation: none; }
    }
  </style>
  <rect class="bg" width="32" height="32" rx="8"/>
  <rect class="edge" x="0.5" y="0.5" width="31" height="31" rx="7.5"/>
  <g class="orbit">
    <circle class="fg" cx="16" cy="16" r="9" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="42 14.55"/>
    <circle class="dot" cx="22.2" cy="9.5" r="2.2"/>
  </g>
</svg>
